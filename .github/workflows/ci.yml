name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install flask flask-cors fastapi uvicorn
      
      - name: Check Python files
        run: |
          python -m py_compile module-a-leads/app.py
          python -m py_compile module-b-cart/cart.py
          python -m py_compile module-d-tasks/main.py
          python -m py_compile module-e-reports/reports.py
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
      
      - name: Check Node.js file
        run: node -c module-c-deals/server.js