name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '18.x'

jobs:
  # ========== ЛИНТИНГ ==========
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install flake8
        run: pip install flake8
      
      - name: Run flake8 on Python modules
        run: |
          flake8 module-a-leads/*.py --ignore=E501
          flake8 module-b-cart/*.py --ignore=E501
          flake8 module-d-tasks/*.py --ignore=E501
          flake8 module-e-reports/*.py --ignore=E501
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Run ESLint on Node.js module
        run: |
          cd module-c-deals
          npm init -y
          npm install eslint --save-dev
          npx eslint server.js --no-eslintrc --env "node,es2021" || true

  # ========== ТЕСТИРОВАНИЕ ==========
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Python dependencies
        run: |
          pip install pytest flask flask-cors
      
      - name: Create dummy test file
        run: |
          cat > test_api.py << 'EOF'
          import pytest
          import requests
          
          def test_imports():
              import flask
              assert flask.__name__ == 'flask'
          
          def test_dummy():
              assert True
          EOF
      
      - name: Run Python tests
        run: pytest test_api.py -v

  # ========== СБОРКА DOCKER ОБРАЗОВ ==========
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Module A Image
        run: |
          cd module-a-leads
          docker build -t crm-leads:latest .
      
      - name: Build Module B Image
        run: |
          cd module-b-cart
          docker build -t crm-cart:latest .
      
      - name: Build Module C Image
        run: |
          cd module-c-deals
          docker build -t crm-deals:latest .
      
      - name: Build Module D Image
        run: |
          cd module-d-tasks
          docker build -t crm-tasks:latest .
      
      - name: Build Module E Image
        run: |
          cd module-e-reports
          docker build -t crm-reports:latest .
      
      - name: List built images
        run: docker images | grep crm

  # ========== ИНТЕГРАЦИОННОЕ ТЕСТИРОВАНИЕ ==========
  integration-test:
    name: Integration Tests with Docker Compose
    runs-on: ubuntu-latest
    needs: build-docker
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create docker-compose.yml
        run: |
          cat > docker-compose.yml << 'EOF'
          version: '3.8'
          services:
            module-a-leads:
              build: ./module-a-leads
              ports:
                - "5001:5001"
            module-b-cart:
              build: ./module-b-cart
              ports:
                - "5002:5002"
            module-c-deals:
              build: ./module-c-deals
              ports:
                - "3000:3000"
            module-d-tasks:
              build: ./module-d-tasks
              ports:
                - "5003:5003"
            module-e-reports:
              build: ./module-e-reports
              ports:
                - "3001:3001"
            postgres:
              image: postgres:15-alpine
              environment:
                POSTGRES_USER: test_user
                POSTGRES_PASSWORD: test_pass
                POSTGRES_DB: test_db
              ports:
                - "5432:5432"
            redis:
              image: redis:7-alpine
              ports:
                - "6379:6379"
          EOF
      
      - name: Start Docker Compose
        run: docker-compose up -d --build
      
      - name: Wait for services to be ready
        run: sleep 30
      
      - name: Test Module A
        run: |
          curl -f http://localhost:5001/products || exit 1
          echo "✅ Module A is working"
      
      - name: Test Module B
        run: |
          curl -f http://localhost:5002/cart || exit 1
          echo "✅ Module B is working"
      
      - name: Test Module C
        run: |
          curl -f http://localhost:3000/deals || exit 1
          echo "✅ Module C is working"
      
      - name: Test Module D
        run: |
          curl -f http://localhost:5003/tasks || exit 1
          echo "✅ Module D is working"
      
      - name: Test Module E
        run: |
          curl -f http://localhost:3001/reports || exit 1
          echo "✅ Module E is working"
      
      - name: Show Docker logs on failure
        if: failure()
        run: docker-compose logs
      
      - name: Stop Docker Compose
        if: always()
        run: docker-compose down

  # ========== ЗАВЕРШЕНИЕ ==========
  finish:
    name: CI/CD Completed
    runs-on: ubuntu-latest
    needs: [lint, test, build-docker, integration-test]
    if: always()
    
    steps:
      - name: Print status
        run: |
          echo "========================================="
          echo "CI/CD Pipeline Completed!"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Build Docker: ${{ needs.build-docker.result }}"
          echo "Integration Test: ${{ needs.integration-test.result }}"
          echo "========================================="