<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Система отдела продаж</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h2 {
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card h2 .emoji {
            font-size: 1.5em;
        }

        .product, .cart-item, .deal-item, .task-item, .report-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .product:hover, .cart-item:hover {
            background: #e9ecef;
        }

        .product-info {
            flex: 1;
        }

        .product-name {
            font-weight: bold;
            font-size: 1.1em;
        }

        .product-price {
            color: #28a745;
            font-weight: bold;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn-danger {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
        }

        .btn-success {
            background: linear-gradient(135deg, #28a745 0%, #218838 100%);
        }

        .btn-warning {
            background: linear-gradient(135deg, #ffc107 0%, #e0a800 100%);
            color: #333;
        }

        .total {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #dee2e6;
            font-size: 1.2em;
            font-weight: bold;
            text-align: right;
        }

        .empty {
            text-align: center;
            color: #6c757d;
            padding: 20px;
            font-style: italic;
        }

        .status {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-new { background: #17a2b8; color: white; }
        .status-contacted { background: #ffc107; color: #333; }
        .status-qualified { background: #28a745; color: white; }
        .status-lost { background: #dc3545; color: white; }
        .status-pending { background: #ffc107; color: #333; }
        .status-completed { background: #28a745; color: white; }

        input, textarea, select {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 500px;
            max-width: 90%;
        }

        .modal-content h3 {
            margin-bottom: 20px;
        }

        .close {
            float: right;
            cursor: pointer;
            font-size: 24px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏢 CRM Система отдела продаж</h1>

        <!-- Статистика -->
        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-number" id="statLeads">0</div>
                <div class="stat-label">Лидов</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="statDeals">0</div>
                <div class="stat-label">Сделок</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="statTasks">0</div>
                <div class="stat-label">Задач</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="statRevenue">0</div>
                <div class="stat-label">Выручка (₽)</div>
            </div>
        </div>

        <div class="grid">
            <!-- Модуль А: Лиды -->
            <div class="card">
                <h2>
                    <span class="emoji">🎯</span>
                    Лиды
                    <button class="btn-success" style="margin-left: auto; padding: 5px 10px;" onclick="openLeadModal()">+ Добавить</button>
                </h2>
                <div id="leadsList">
                    <div class="empty">Загрузка...</div>
                </div>
            </div>

            <!-- Модуль А: Товары -->
            <div class="card">
                <h2>
                    <span class="emoji">🛍️</span>
                    Каталог товаров
                </h2>
                <div id="productsList">
                    <div class="empty">Загрузка...</div>
                </div>
            </div>

            <!-- Модуль Б: Корзина -->
            <div class="card">
                <h2>
                    <span class="emoji">🛒</span>
                    Корзина
                </h2>
                <div id="cartList">
                    <div class="empty">Корзина пуста</div>
                </div>
                <button class="btn-success" style="width: 100%; margin-top: 10px;" onclick="createOrder()">📦 Оформить заказ</button>
            </div>

            <!-- Модуль В: Сделки -->
            <div class="card">
                <h2>
                    <span class="emoji">💼</span>
                    Сделки
                </h2>
                <div id="dealsList">
                    <div class="empty">Загрузка...</div>
                </div>
            </div>

            <!-- Модуль D: Задачи -->
            <div class="card">
                <h2>
                    <span class="emoji">✅</span>
                    Задачи
                    <button class="btn-success" style="margin-left: auto; padding: 5px 10px;" onclick="openTaskModal()">+ Добавить</button>
                </h2>
                <div id="tasksList">
                    <div class="empty">Загрузка...</div>
                </div>
            </div>

            <!-- Модуль E: Отчеты -->
            <div class="card">
                <h2>
                    <span class="emoji">📊</span>
                    Отчеты
                    <button class="btn-warning" style="margin-left: auto; padding: 5px 10px;" onclick="generateReport()">📈 Создать отчет</button>
                </h2>
                <div id="reportsList">
                    <div class="empty">Нет отчетов</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно для добавления лида -->
    <div id="leadModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeLeadModal()">&times;</span>
            <h3>➕ Новый лид</h3>
            <input type="text" id="leadName" placeholder="Имя">
            <input type="text" id="leadPhone" placeholder="Телефон">
            <input type="email" id="leadEmail" placeholder="Email">
            <select id="leadSource">
                <option value="website">Сайт</option>
                <option value="call">Звонок</option>
                <option value="email">Email</option>
                <option value="partner">Партнер</option>
            </select>
            <button onclick="addLead()" style="width: 100%;">Создать лида</button>
        </div>
    </div>

    <!-- Модальное окно для добавления задачи -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeTaskModal()">&times;</span>
            <h3>📋 Новая задача</h3>
            <input type="text" id="taskTitle" placeholder="Название задачи">
            <textarea id="taskDesc" placeholder="Описание" rows="3"></textarea>
            <input type="text" id="taskAssigned" placeholder="Кому">
            <input type="date" id="taskDueDate">
            <button onclick="addTask()" style="width: 100%;">Создать задачу</button>
        </div>
    </div>

    <script>
        // API endpoints
        const API = {
            leads: 'http://localhost:5001/leads',
            products: 'http://localhost:5001/products',
            cart: 'http://localhost:5002/cart',
            cartAdd: 'http://localhost:5002/cart/add',
            cartClear: 'http://localhost:5002/cart/clear',
            deals: 'http://localhost:3000/deals',
            dealsCreate: 'http://localhost:3000/deals/create',
            tasks: 'http://localhost:5003/tasks',
            tasksCreate: 'http://localhost:5003/tasks/create',
            reports: 'http://localhost:3001/reports',
            reportsSales: 'http://localhost:3001/reports/sales'
        };

        // ========== МОДУЛЬ А: ЛИДЫ ==========
        async function loadLeads() {
            try {
                const res = await fetch(API.leads);
                const leads = await res.json();
                if(leads.length === 0) {
                    document.getElementById('leadsList').innerHTML = '<div class="empty">Нет лидов</div>';
                    document.getElementById('statLeads').innerText = '0';
                    return;
                }
                const html = leads.map(l => `
                    <div class="product">
                        <div class="product-info">
                            <div class="product-name">${l.name}</div>
                            <div>📞 ${l.phone || '—'} | ✉️ ${l.email || '—'}</div>
                            <span class="status status-${l.status}">${l.status}</span>
                        </div>
                    </div>
                `).join('');
                document.getElementById('leadsList').innerHTML = html;
                document.getElementById('statLeads').innerText = leads.length;
            } catch(e) {
                document.getElementById('leadsList').innerHTML = '<div class="empty">❌ Ошибка загрузки</div>';
            }
        }

        async function addLead() {
            const lead = {
                name: document.getElementById('leadName').value,
                phone: document.getElementById('leadPhone').value,
                email: document.getElementById('leadEmail').value,
                source: document.getElementById('leadSource').value,
                status: 'new'
            };
            try {
                await fetch(API.leads, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(lead)
                });
                closeLeadModal();
                document.getElementById('leadName').value = '';
                document.getElementById('leadPhone').value = '';
                document.getElementById('leadEmail').value = '';
                loadLeads();
            } catch(e) {
                alert('Ошибка создания лида');
            }
        }

        // ========== МОДУЛЬ А: ТОВАРЫ ==========
        async function loadProducts() {
            try {
                const res = await fetch(API.products);
                const products = await res.json();
                const html = products.map(p => `
                    <div class="product">
                        <div class="product-info">
                            <div class="product-name">${p.name}</div>
                            <div class="product-price">${p.price.toLocaleString()} ₽</div>
                        </div>
                        <button onclick="addToCart(${p.id}, '${p.name}', ${p.price})">➕ В корзину</button>
                    </div>
                `).join('');
                document.getElementById('productsList').innerHTML = html;
            } catch(e) {
                document.getElementById('productsList').innerHTML = '<div class="empty">❌ Ошибка загрузки товаров</div>';
            }
        }

        // ========== МОДУЛЬ Б: КОРЗИНА ==========
        let cart = [];

        async function loadCart() {
            try {
                const res = await fetch(API.cart);
                cart = await res.json();
                if(cart.length === 0) {
                    document.getElementById('cartList').innerHTML = '<div class="empty">Корзина пуста</div>';
                    return;
                }
                const total = cart.reduce((sum, item) => sum + item.price, 0);
                const html = cart.map((item, idx) => `
                    <div class="cart-item">
                        <div>
                            <div class="product-name">${item.name}</div>
                            <div class="product-price">${item.price.toLocaleString()} ₽</div>
                        </div>
                        <button class="btn-danger" onclick="removeFromCart(${idx})">🗑️</button>
                    </div>
                `).join('');
                document.getElementById('cartList').innerHTML = html + `
                    <div class="total">
                        Итого: ${total.toLocaleString()} ₽
                    </div>
                `;
            } catch(e) {
                document.getElementById('cartList').innerHTML = '<div class="empty">❌ Ошибка загрузки корзины</div>';
            }
        }

        async function addToCart(id, name, price) {
            try {
                await fetch(API.cartAdd, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({id, name, price})
                });
                loadCart();
            } catch(e) {
                alert('Ошибка добавления в корзину');
            }
        }

        async function removeFromCart(index) {
            try {
                // Пересоздаем корзину без удаленного элемента
                const newCart = cart.filter((_, i) => i !== index);
                await fetch(API.cartClear, {method: 'POST'});
                for(const item of newCart) {
                    await fetch(API.cartAdd, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(item)
                    });
                }
                loadCart();
            } catch(e) {
                alert('Ошибка удаления');
            }
        }

        // ========== МОДУЛЬ В: СДЕЛКИ ==========
        async function loadDeals() {
            try {
                const res = await fetch(API.deals);
                const deals = await res.json();
                if(deals.length === 0) {
                    document.getElementById('dealsList').innerHTML = '<div class="empty">Нет сделок</div>';
                    document.getElementById('statDeals').innerText = '0';
                    document.getElementById('statRevenue').innerText = '0';
                    return;
                }
                const totalRevenue = deals.reduce((sum, d) => sum + (d.amount || 0), 0);
                const html = deals.map(d => `
                    <div class="deal-item">
                        <div>
                            <div class="product-name">Сделка #${d.id}</div>
                            <div>💰 ${(d.amount || 0).toLocaleString()} ₽</div>
                            <div>📌 ${d.stage || 'negotiation'}</div>
                            <div>📅 ${new Date(d.createdAt).toLocaleDateString()}</div>
                        </div>
                        <select onchange="updateDealStage(${d.id}, this.value)">
                            <option value="new" ${d.stage === 'new' ? 'selected' : ''}>Новая</option>
                            <option value="negotiation" ${d.stage === 'negotiation' ? 'selected' : ''}>Переговоры</option>
                            <option value="contract" ${d.stage === 'contract' ? 'selected' : ''}>Контракт</option>
                            <option value="closed" ${d.stage === 'closed' ? 'selected' : ''}>Закрыта</option>
                        </select>
                    </div>
                `).join('');
                document.getElementById('dealsList').innerHTML = html;
                document.getElementById('statDeals').innerText = deals.length;
                document.getElementById('statRevenue').innerText = totalRevenue.toLocaleString();
            } catch(e) {
                document.getElementById('dealsList').innerHTML = '<div class="empty">❌ Ошибка загрузки сделок</div>';
            }
        }

        async function createOrder() {
            if(cart.length === 0) {
                alert('Корзина пуста!');
                return;
            }
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            try {
                await fetch(API.dealsCreate, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        amount: total,
                        stage: 'new',
                        items: cart
                    })
                });
                await fetch(API.cartClear, {method: 'POST'});
                loadCart();
                loadDeals();
                alert('✅ Заказ оформлен! Сделка создана.');
            } catch(e) {
                alert('Ошибка создания сделки');
            }
        }

        async function updateDealStage(dealId, stage) {
            try {
                await fetch(`${API.deals}/${dealId}/stage`, {
                    method: 'PATCH',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({stage})
                });
                loadDeals();
            } catch(e) {
                alert('Ошибка обновления');
            }
        }

        // ========== МОДУЛЬ D: ЗАДАЧИ ==========
        async function loadTasks() {
            try {
                const res = await fetch(API.tasks);
                const tasks = await res.json();
                if(tasks.length === 0) {
                    document.getElementById('tasksList').innerHTML = '<div class="empty">Нет задач</div>';
                    document.getElementById('statTasks').innerText = '0';
                    return;
                }
                const html = tasks.map(t => `
                    <div class="task-item">
                        <div>
                            <div class="product-name">${t.title}</div>
                            <div>📝 ${t.description || '—'}</div>
                            <div>👤 ${t.assigned_to}</div>
                            <div>📅 ${t.due_date || '—'}</div>
                            <span class="status status-${t.status}">${t.status}</span>
                        </div>
                        ${t.status === 'pending' ? `<button class="btn-success" onclick="completeTask(${t.id})">✅ Выполнить</button>` : ''}
                    </div>
                `).join('');
                document.getElementById('tasksList').innerHTML = html;
                document.getElementById('statTasks').innerText = tasks.length;
            } catch(e) {
                document.getElementById('tasksList').innerHTML = '<div class="empty">❌ Ошибка загрузки задач</div>';
            }
        }

        async function addTask() {
            const task = {
                title: document.getElementById('taskTitle').value,
                description: document.getElementById('taskDesc').value,
                assigned_to: document.getElementById('taskAssigned').value,
                due_date: document.getElementById('taskDueDate').value,
                deal_id: 1
            };
            try {
                await fetch(API.tasksCreate, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(task)
                });
                closeTaskModal();
                document.getElementById('taskTitle').value = '';
                document.getElementById('taskDesc').value = '';
                document.getElementById('taskAssigned').value = '';
                document.getElementById('taskDueDate').value = '';
                loadTasks();
            } catch(e) {
                alert('Ошибка создания задачи');
            }
        }

        async function completeTask(taskId) {
            try {
                await fetch(`${API.tasks}/${taskId}/complete`, {method: 'PATCH'});
                loadTasks();
            } catch(e) {
                alert('Ошибка выполнения задачи');
            }
        }

        // ========== МОДУЛЬ E: ОТЧЕТЫ ==========
        async function loadReports() {
            try {
                const res = await fetch(API.reports);
                const reports = await res.json();
                if(reports.length === 0) {
                    document.getElementById('reportsList').innerHTML = '<div class="empty">Нет отчетов</div>';
                    return;
                }
                const html = reports.map(r => `
                    <div class="report-item">
                        <div>
                            <div class="product-name">Отчет #${r.id}</div>
                            <div>📈 Период: ${r.period}</div>
                            <div>💰 Выручка: ${(r.total_sales || 0).toLocaleString()} ₽</div>
                            <div>📊 Сделок: ${r.deals_count || 0}</div>
                            <div>📅 ${new Date(r.generated_at).toLocaleString()}</div>
                        </div>
                    </div>
                `).join('');
                document.getElementById('reportsList').innerHTML = html;
            } catch(e) {
                document.getElementById('reportsList').innerHTML = '<div class="empty">❌ Ошибка загрузки отчетов</div>';
            }
        }

        async function generateReport() {
            try {
                const dealsRes = await fetch(API.deals);
                const deals = await dealsRes.json();
                const total = deals.reduce((sum, d) => sum + (d.amount || 0), 0);
                
                await fetch(API.reportsSales, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        period: 'daily',
                        total: total,
                        deals_count: deals.length
                    })
                });
                loadReports();
                alert('📊 Отчет создан!');
            } catch(e) {
                alert('Ошибка создания отчета');
            }
        }

        // ========== МОДАЛЬНЫЕ ОКНА ==========
        function openLeadModal() {
            document.getElementById('leadModal').style.display = 'flex';
        }
        function closeLeadModal() {
            document.getElementById('leadModal').style.display = 'none';
        }
        function openTaskModal() {
            document.getElementById('taskModal').style.display = 'flex';
        }
        function closeTaskModal() {
            document.getElementById('taskModal').style.display = 'none';
        }

        // Закрытие модального окна при клике вне его
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = 'none';
            }
        }

        // ========== ЗАГРУЗКА ВСЕХ ДАННЫХ ==========
        function loadAll() {
            loadLeads();
            loadProducts();
            loadCart();
            loadDeals();
            loadTasks();
            loadReports();
        }

        // Обновляем каждые 5 секунд
        loadAll();
        setInterval(loadAll, 5000);
    </script>
</body>
</html>
