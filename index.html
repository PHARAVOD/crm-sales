<!DOCTYPE html>
<html>
<head>
    <title>CRM Система - Полная версия</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #f0f2f5; padding: 20px; }
        h1 { text-align: center; color: #333; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
        .card { background: white; border-radius: 10px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card h3 { margin-bottom: 15px; color: #007bff; border-bottom: 2px solid #007bff; padding-bottom: 5px; }
        .item { border-bottom: 1px solid #eee; padding: 8px 0; }
        .item:last-child { border-bottom: none; }
        button { background: #007bff; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; margin: 2px; }
        button:hover { opacity: 0.8; }
        .btn-success { background: #28a745; }
        .btn-danger { background: #dc3545; }
        .btn-warning { background: #ffc107; color: #333; }
        .form-row { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        input, select { padding: 5px; border: 1px solid #ddd; border-radius: 5px; flex: 1; }
        .status { font-size: 12px; padding: 2px 6px; border-radius: 10px; }
        .status-new { background: #17a2b8; color: white; }
        .status-paid { background: #28a745; color: white; }
        .status-shipped { background: #ffc107; color: #333; }
        .status-delivered { background: #28a745; color: white; }
        .status-cancelled { background: #dc3545; color: white; }
        .small-text { font-size: 11px; color: #666; }
        .total { font-weight: bold; margin-top: 10px; padding-top: 10px; border-top: 2px solid #ddd; }
        .message { padding: 10px; border-radius: 5px; margin-top: 10px; display: none; }
        .message.success { background: #d4edda; color: #155724; display: block; }
        .message.error { background: #f8d7da; color: #721c24; display: block; }
    </style>
</head>
<body>

<h1>🏢 CRM Система отдела продаж</h1>

<div class="grid">
    <!-- ЛИДЫ (Модуль А) -->
    <div class="card">
        <h3>🎯 Лиды</h3>
        <div id="leadsList">Загрузка...</div>
        <div class="form-row">
            <input type="text" id="leadName" placeholder="Имя">
            <input type="text" id="leadPhone" placeholder="Телефон">
            <button onclick="addLead()">➕ Добавить</button>
        </div>
    </div>

    <!-- КОНТАКТЫ (Модуль А/Б) -->
    <div class="card">
        <h3>📇 Контакты</h3>
        <div id="contactsList">Загрузка...</div>
    </div>

    <!-- ТОВАРЫ (Модуль А) -->
    <div class="card">
        <h3>🛍️ Товары</h3>
        <div id="productsList">Загрузка...</div>
    </div>

    <!-- КОРЗИНА (Модуль Б) -->
    <div class="card">
        <h3>🛒 Корзина</h3>
        <div id="cartList">Пусто</div>
        <button class="btn-success" style="width:100%; margin-top:10px;" onclick="createOrder()">✅ Оформить заказ</button>
    </div>

    <!-- СДЕЛКИ (Модуль В) -->
    <div class="card">
        <h3>💼 Сделки</h3>
        <div id="dealsList">Загрузка...</div>
    </div>

    <!-- ЗАДАЧИ (Модуль D) -->
    <div class="card">
        <h3>✅ Задачи</h3>
        <div id="tasksList">Загрузка...</div>
        <div class="form-row">
            <input type="text" id="taskTitle" placeholder="Название">
            <input type="text" id="taskAssigned" placeholder="Кому">
            <button onclick="addTask()">➕ Добавить</button>
        </div>
    </div>

    <!-- ОТЧЕТЫ (Модуль E) -->
    <div class="card">
        <h3>📊 Отчеты</h3>
        <div id="reportsList">Загрузка...</div>
        <button onclick="generateReport()" style="width:100%; margin-top:10px;">📈 Создать отчет</button>
    </div>
</div>

<div id="message" class="message"></div>

<script>
    const API = {
        leads: 'http://localhost:5001/leads',
        products: 'http://localhost:5001/products',
        contacts: 'http://localhost:5001/contacts',
        cart: 'http://localhost:5002/cart',
        cartAdd: 'http://localhost:5002/cart/add',
        cartClear: 'http://localhost:5002/cart/clear',
        deals: 'http://localhost:3000/deals',
        dealsCreate: 'http://localhost:3000/deals/create',
        tasks: 'http://localhost:5003/tasks',
        tasksCreate: 'http://localhost:5003/tasks/create',
        reports: 'http://localhost:3001/reports',
        reportsSales: 'http://localhost:3001/reports/sales'
    };

    function showMessage(msg, type) {
        const div = document.getElementById('message');
        div.className = `message ${type}`;
        div.innerHTML = msg;
        setTimeout(() => { div.className = 'message'; }, 3000);
    }

    // ========== ЛИДЫ ==========
    async function loadLeads() {
        try {
            const res = await fetch(API.leads);
            const leads = await res.json();
            if(leads.length === 0) { document.getElementById('leadsList').innerHTML = 'Нет лидов'; return; }
            document.getElementById('leadsList').innerHTML = leads.map(l => `
                <div class="item"><strong>${l.name}</strong><br>📞 ${l.phone || '-'}<br><span class="status status-${l.status}">${l.status}</span></div>
            `).join('');
        } catch(e) { document.getElementById('leadsList').innerHTML = 'Ошибка'; }
    }

    async function addLead() {
        const name = document.getElementById('leadName').value;
        const phone = document.getElementById('leadPhone').value;
        if(!name) { showMessage('Введите имя', 'error'); return; }
        try {
            await fetch(API.leads, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, phone, status: 'new' }) });
            document.getElementById('leadName').value = '';
            document.getElementById('leadPhone').value = '';
            loadLeads();
            showMessage('✅ Лид добавлен', 'success');
        } catch(e) { showMessage('Ошибка', 'error'); }
    }

    // ========== ТОВАРЫ ==========
    async function loadProducts() {
        try {
            const res = await fetch(API.products);
            const products = await res.json();
            document.getElementById('productsList').innerHTML = products.map(p => `
                <div class="item"><strong>${p.name}</strong><br>${p.price} ₽<br><button onclick="addToCart(${p.id}, '${p.name}', ${p.price})">В корзину</button></div>
            `).join('');
        } catch(e) { document.getElementById('productsList').innerHTML = 'Ошибка'; }
    }

    async function addToCart(id, name, price) {
        try {
            await fetch(API.cartAdd, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, name, price, quantity: 1 }) });
            loadCart();
            showMessage(`✅ ${name} добавлен в корзину`, 'success');
        } catch(e) { showMessage('Ошибка', 'error'); }
    }

    // ========== КОРЗИНА ==========
    async function loadCart() {
        try {
            const res = await fetch(API.cart);
            const cart = await res.json();
            if(!cart || cart.length === 0) { document.getElementById('cartList').innerHTML = 'Корзина пуста'; return; }
            const total = cart.reduce((s, i) => s + (i.price * (i.quantity || 1)), 0);
            document.getElementById('cartList').innerHTML = cart.map(i => `<div class="item">${i.name} - ${(i.price * (i.quantity || 1)).toLocaleString()} ₽</div>`).join('') + `<div class="total">Итого: ${total.toLocaleString()} ₽</div>`;
        } catch(e) { document.getElementById('cartList').innerHTML = 'Ошибка'; }
    }

    // ========== СДЕЛКИ ==========
    async function loadDeals() {
        try {
            const res = await fetch(API.deals);
            const deals = await res.json();
            if(deals.length === 0) { document.getElementById('dealsList').innerHTML = 'Нет сделок'; return; }
            document.getElementById('dealsList').innerHTML = deals.map(d => `<div class="item"><strong>Сделка #${d.id}</strong><br>💰 ${d.amount?.toLocaleString() || 0} ₽<br><span class="status status-${d.stage}">${d.stage}</span><br><span class="small-text">${new Date(d.createdAt).toLocaleString()}</span></div>`).join('');
        } catch(e) { document.getElementById('dealsList').innerHTML = 'Ошибка'; }
    }

    // ========== ЗАДАЧИ ==========
    async function loadTasks() {
        try {
            const res = await fetch(API.tasks);
            const tasks = await res.json();
            if(tasks.length === 0) { document.getElementById('tasksList').innerHTML = 'Нет задач'; return; }
            document.getElementById('tasksList').innerHTML = tasks.map(t => `<div class="item"><strong>${t.title}</strong><br>👤 ${t.assigned_to}<br><span class="status status-${t.status}">${t.status}</span></div>`).join('');
        } catch(e) { document.getElementById('tasksList').innerHTML = 'Ошибка'; }
    }

    async function addTask() {
        const title = document.getElementById('taskTitle').value;
        const assigned = document.getElementById('taskAssigned').value;
        if(!title) { showMessage('Введите название', 'error'); return; }
        try {
            await fetch(API.tasksCreate, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title, assigned_to: assigned || 'manager@crm.com', deal_id: 1, due_date: '2026-06-07' }) });
            document.getElementById('taskTitle').value = '';
            document.getElementById('taskAssigned').value = '';
            loadTasks();
            showMessage('✅ Задача добавлена', 'success');
        } catch(e) { showMessage('Ошибка', 'error'); }
    }

    // ========== ОТЧЕТЫ ==========
    async function loadReports() {
        try {
            const res = await fetch(API.reports);
            const reports = await res.json();
            if(reports.length === 0) { document.getElementById('reportsList').innerHTML = 'Нет отчетов'; return; }
            document.getElementById('reportsList').innerHTML = reports.map(r => `<div class="item"><strong>Отчет #${r.id}</strong><br>📈 ${r.period}<br>💰 ${r.total_sales?.toLocaleString() || 0} ₽<br><span class="small-text">${new Date(r.generated_at).toLocaleString()}</span></div>`).join('');
        } catch(e) { document.getElementById('reportsList').innerHTML = 'Ошибка'; }
    }

    async function generateReport() {
        try {
            const dealsRes = await fetch(API.deals);
            const deals = await dealsRes.json();
            const total = deals.reduce((s, d) => s + (d.amount || 0), 0);
            await fetch(API.reportsSales, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ period: 'daily', total: total, deals_count: deals.length }) });
            loadReports();
            showMessage('✅ Отчет создан', 'success');
        } catch(e) { showMessage('Ошибка', 'error'); }
    }

    // ========== ОФОРМЛЕНИЕ ЗАКАЗА ==========
    async function createOrder() {
        try {
            const cartRes = await fetch(API.cart);
            const cart = await cartRes.json();
            if(!cart || cart.length === 0) { showMessage('❌ Корзина пуста', 'error'); return; }
            const total = cart.reduce((s, i) => s + (i.price * (i.quantity || 1)), 0);
            await fetch(API.dealsCreate, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contactId: 1, amount: total, stage: 'new' }) });
            await fetch(API.cartClear, { method: 'POST' });
            loadCart();
            loadDeals();
            showMessage(`✅ Заказ оформлен! Сумма: ${total.toLocaleString()} ₽`, 'success');
        } catch(e) { showMessage('Ошибка создания заказа', 'error'); }
    }

    // Загрузка всего при старте
    loadLeads();
    loadProducts();
    loadCart();
    loadDeals();
    loadTasks();
    loadReports();

    // Обновление каждые 3 секунды
    setInterval(() => { loadCart(); loadDeals(); loadTasks(); }, 3000);
</script>
</body>
</html>
