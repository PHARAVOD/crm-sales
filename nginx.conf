events {
    worker_connections 1024;
}

http {
    upstream leads_backend {
        server module-a-leads:5001;
    }
    
    upstream cart_backend {
        server module-b-cart:5002;
    }
    
    upstream deals_backend {
        server module-c-deals:3000;
    }
    
    upstream tasks_backend {
        server module-d-tasks:5003;
    }
    
    upstream reports_backend {
        server module-e-reports:3001;
    }

    server {
        listen 80;
        
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
        
        location /api/leads/ {
            proxy_pass http://leads_backend/;
            proxy_set_header Host $host;
        }
        
        location /api/cart/ {
            proxy_pass http://cart_backend/;
            proxy_set_header Host $host;
        }
        
        location /api/deals/ {
            proxy_pass http://deals_backend/;
            proxy_set_header Host $host;
        }
        
        location /api/tasks/ {
            proxy_pass http://tasks_backend/;
            proxy_set_header Host $host;
        }
        
        location /api/reports/ {
            proxy_pass http://reports_backend/;
            proxy_set_header Host $host;
        }
    }
}