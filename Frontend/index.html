<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Магазин - Оформление заказа</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .product-card { transition: transform 0.2s; cursor: pointer; }
        .product-card:hover { transform: scale(1.02); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .status-badge { position: fixed; top: 20px; right: 20px; z-index: 1000; }
        .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 1100; }
        .order-status { 
            transition: all 0.3s ease;
            padding: 10px;
            border-radius: 8px;
        }
        .status-new { background: #6c757d; color: white; }
        .status-paid { background: #007bff; color: white; }
        .status-shipped { background: #ffc107; color: black; }
        .status-delivered { background: #28a745; color: white; }
        .status-cancelled { background: #dc3545; color: white; }
    </style>
</head>
<body class="bg-light">

    <!-- Status Badge -->
    <div class="status-badge">
        <div class="card" style="width: 200px;">
            <div class="card-body p-2 text-center">
                <i class="fas fa-plug"></i>
                <span id="apiStatus" class="badge bg-success">API OK</span>
                <div class="small text-muted" id="lastUpdate">Обновлено: сейчас</div>
            </div>
        </div>
    </div>

    <!-- Toast уведомления -->
    <div class="toast-container">
        <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true" data-bs-autohide="true" data-bs-delay="3000">
            <div class="toast-header">
                <i class="fas fa-bell me-2 text-primary"></i>
                <strong class="me-auto">CRM Уведомление</strong>
                <small>только что</small>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastMessage">
                Сообщение...
            </div>
        </div>
    </div>

    <div class="container py-4">
        <div class="text-center mb-4">
            <h1 class="display-4">🛍️ CRM Магазин</h1>
            <p class="lead">Сквозной процесс: Каталог → Корзина → Заказ → Доставка</p>
            <hr>
        </div>

        <div class="row">
            <!-- Левая колонка: Каталог товаров -->
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <i class="fas fa-box"></i> Каталог товаров
                    </div>
                    <div class="card-body" id="productsList">
                        <div class="text-center p-3">
                            <div class="spinner-border text-primary"></div>
                            <p>Загрузка товаров...</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Средняя колонка: Корзина -->
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white">
                        <i class="fas fa-shopping-cart"></i> Корзина
                    </div>
                    <div class="card-body" id="cartList">
                        <div class="text-center p-3 text-muted">
                            <i class="fas fa-cart-plus fa-2x"></i>
                            <p>Корзина пуста</p>
                        </div>
                    </div>
                    <div class="card-footer">
                        <button class="btn btn-success w-100" id="checkoutBtn" disabled>
                            <i class="fas fa-credit-card"></i> Оформить заказ
                        </button>
                    </div>
                </div>
            </div>

            <!-- Правая колонка: Статус заказа -->
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-info text-white">
                        <i class="fas fa-truck"></i> Статус заказа
                    </div>
                    <div class="card-body" id="orderStatus">
                        <div class="text-center p-3 text-muted">
                            <i class="fas fa-clipboard-list fa-2x"></i>
                            <p>Нет активных заказов</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Лог событий -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">
                        <i class="fas fa-history"></i> Лог интеграции (Real-time)
                    </div>
                    <div class="card-body" id="eventLog" style="height: 200px; overflow-y: auto; font-family: monospace; font-size: 12px;">
                        <div class="text-muted text-center">Готов к работе...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Конфигурация API
        const API_CONFIG = {
            products: 'http://localhost:5001/products',
            cart: 'http://localhost:5002/cart',
            cartAdd: 'http://localhost:5002/cart/add',
            cartClear: 'http://localhost:5002/cart/clear',
            orderWorkflow: 'http://localhost:5000/api/order/create'  // Будет через наш Saga
        };

        let currentOrder = null;
        let eventLog = [];
        let toast;

        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            toast = new bootstrap.Toast(document.getElementById('liveToast'));
            loadProducts();
            loadCart();
            setInterval(() => {
                loadCart();
                document.getElementById('lastUpdate').innerHTML = `Обновлено: ${new Date().toLocaleTimeString()}`;
            }, 5000);
        });

        // Добавить сообщение в лог
        function addLog(message, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const colors = { info: '#0d6efd', success: '#198754', error: '#dc3545', warning: '#ffc107' };
            eventLog.unshift(`[${time}] ${message}`);
            if (eventLog.length > 20) eventLog.pop();
            
            const logDiv = document.getElementById('eventLog');
            logDiv.innerHTML = eventLog.map(msg => {
                let color = '#333';
                if (msg.includes('✅')) color = '#198754';
                else if (msg.includes('❌')) color = '#dc3545';
                else if (msg.includes('⚠️')) color = '#ffc107';
                else if (msg.includes('🚀')) color = '#0d6efd';
                return `<div style="color: ${color}">${msg}</div>`;
            }).join('');
            logDiv.scrollTop = 0;
        }

        function showToast(message, type = 'success') {
            const toastBody = document.getElementById('toastMessage');
            toastBody.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-triangle'}"></i> ${message}`;
            toast.show();
        }

        // Загрузка товаров (Модуль А)
        async function loadProducts() {
            try {
                const response = await fetch(API_CONFIG.products);
                const products = await response.json();
                
                const html = products.map(p => `
                    <div class="product-card card mb-2" onclick="addToCart(${p.id}, '${p.name}', ${p.price})">
                        <div class="card-body p-2">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <strong>${p.name}</strong><br>
                                    <small class="text-muted">${p.price.toLocaleString()} ₽</small>
                                </div>
                                <button class="btn btn-sm btn-primary">
                                    <i class="fas fa-cart-plus"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `).join('');
                
                document.getElementById('productsList').innerHTML = html;
                addLog('✅ Товары загружены из модуля А (порт 5001)', 'success');
            } catch (error) {
                document.getElementById('productsList').innerHTML = '<div class="alert alert-danger">Ошибка загрузки товаров</div>';
                addLog('❌ Ошибка подключения к модулю А', 'error');
            }
        }

        // Добавление в корзину (Модуль Б)
        async function addToCart(id, name, price) {
            try {
                addLog(`🛒 Добавление: ${name} (${price.toLocaleString()} ₽)`, 'info');
                
                const response = await fetch(API_CONFIG.cartAdd, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, name, price, quantity: 1 })
                });
                
                if (response.ok) {
                    addLog(`✅ Товар "${name}" добавлен в корзину`, 'success');
                    showToast(`"${name}" добавлен в корзину`, 'success');
                    await loadCart();
                }
            } catch (error) {
                addLog(`❌ Ошибка добавления: ${name}`, 'error');
            }
        }

        // Загрузка корзины
        async function loadCart() {
            try {
                const response = await fetch(API_CONFIG.cart);
                const cart = await response.json();
                const checkoutBtn = document.getElementById('checkoutBtn');
                
                if (!cart || cart.length === 0) {
                    document.getElementById('cartList').innerHTML = `
                        <div class="text-center p-3 text-muted">
                            <i class="fas fa-cart-plus fa-2x"></i>
                            <p>Корзина пуста</p>
                        </div>`;
                    checkoutBtn.disabled = true;
                    return;
                }
                
                const total = cart.reduce((sum, item) => sum + (item.price * (item.quantity || 1)), 0);
                const html = `
                    <div class="list-group list-group-flush">
                        ${cart.map(item => `
                            <div class="list-group-item d-flex justify-content-between align-items-center">
                                <div>
                                    <strong>${item.name}</strong><br>
                                    <small>${item.price.toLocaleString()} ₽ × ${item.quantity || 1}</small>
                                </div>
                                <div>
                                    <span class="badge bg-primary rounded-pill">${((item.price * (item.quantity || 1))).toLocaleString()} ₽</span>
                                    <button class="btn btn-sm btn-danger ms-2" onclick="removeFromCart(${item.id})">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="mt-3 text-end">
                        <strong>Итого: ${total.toLocaleString()} ₽</strong>
                    </div>
                `;
                
                document.getElementById('cartList').innerHTML = html;
                checkoutBtn.disabled = false;
                addLog(`🛍️ Корзина: ${cart.length} товаров на сумму ${total.toLocaleString()} ₽`, 'info');
            } catch (error) {
                addLog('❌ Ошибка загрузки корзины', 'error');
            }
        }

        // Удаление из корзины
        async function removeFromCart(productId) {
            try {
                await fetch(API_CONFIG.cartClear, { method: 'POST' });
                await loadCart();
                addLog(`🗑️ Товар удален из корзины`, 'warning');
                showToast('Товар удален из корзины', 'warning');
            } catch (error) {
                addLog('❌ Ошибка удаления', 'error');
            }
        }

        // Оформление заказа (СКВОЗНОЙ СЦЕНАРИЙ)
        document.getElementById('checkoutBtn').addEventListener('click', async () => {
            addLog('🚀 ЗАПУСК СКВОЗНОГО СЦЕНАРИЯ: Оформление заказа', 'info');
            showToast('Начинаем оформление заказа...', 'info');
            
            // Обновляем статус
            updateOrderStatus('new', 'Заказ создается...');
            
            try {
                // Получаем корзину
                const cartResponse = await fetch(API_CONFIG.cart);
                const cart = await cartResponse.json();
                
                if (!cart || cart.length === 0) {
                    addLog('❌ Корзина пуста', 'error');
                    showToast('Корзина пуста!', 'error');
                    return;
                }
                
                const total = cart.reduce((sum, item) => sum + (item.price * (item.quantity || 1)), 0);
                addLog(`📦 Создание заказа на сумму ${total.toLocaleString()} ₽`, 'info');
                
                // ШАГ 1: Оплата
                updateOrderStatus('paid', 'Оплата...');
                addLog('💰 ШАГ 1/4: Обработка оплаты...', 'info');
                await simulatePayment(total);
                addLog('✅ Оплата успешно проведена', 'success');
                
                // ШАГ 2: Проверка остатков
                updateOrderStatus('stock', 'Проверка остатков...');
                addLog('📦 ШАГ 2/4: Проверка остатков товаров...', 'info');
                for (const item of cart) {
                    await simulateStockCheck(item.id, item.quantity);
                    addLog(`   ✅ ${item.name}: ${item.quantity} шт. в наличии`, 'success');
                }
                
                // ШАГ 3: Отправка
                updateOrderStatus('shipped', 'Отправка...');
                addLog('🚚 ШАГ 3/4: Отправка заказа...', 'info');
                await simulateShipping();
                addLog('✅ Заказ отправлен. Трек-номер: CRM-ORD-001', 'success');
                
                // ШАГ 4: Доставка
                updateOrderStatus('delivered', 'Доставлен!');
                addLog('🏠 ШАГ 4/4: Подтверждение доставки...', 'info');
                await Task.delay(1000);
                addLog('✅ Заказ доставлен клиенту!', 'success');
                
                // Очищаем корзину
                await fetch(API_CONFIG.cartClear, { method: 'POST' });
                await loadCart();
                
                addLog('🎉 СКВОЗНОЙ СЦЕНАРИЙ УСПЕШНО ЗАВЕРШЕН!', 'success');
                showToast('Заказ успешно оформлен и доставлен!', 'success');
                
            } catch (error) {
                addLog(`❌ ОШИБКА: ${error.message}`, 'error');
                updateOrderStatus('cancelled', 'Отменен');
                showToast(`Ошибка: ${error.message}`, 'error');
            }
        });

        // Симуляция платежа
        async function simulatePayment(amount) {
            await Task.delay(800);
            if (amount > 200000) {
                throw new Error('Превышен лимит оплаты');
            }
        }

        // Симуляция проверки остатков
        async function simulateStockCheck(productId, quantity) {
            await Task.delay(300);
            if (productId === 999 || quantity > 100) {
                throw new Error('Недостаточно товара на складе');
            }
        }

        // Симуляция отправки
        async function simulateShipping() {
            await Task.delay(700);
        }

        // Обновление статуса заказа в UI
        function updateOrderStatus(status, message) {
            const statusDiv = document.getElementById('orderStatus');
            let statusClass = 'status-new';
            let icon = 'fa-hourglass-half';
            
            switch(status) {
                case 'new': statusClass = 'status-new'; icon = 'fa-file-invoice'; break;
                case 'paid': statusClass = 'status-paid'; icon = 'fa-credit-card'; break;
                case 'stock': statusClass = 'status-paid'; icon = 'fa-boxes'; break;
                case 'shipped': statusClass = 'status-shipped'; icon = 'fa-truck'; break;
                case 'delivered': statusClass = 'status-delivered'; icon = 'fa-check-circle'; break;
                case 'cancelled': statusClass = 'status-cancelled'; icon = 'fa-ban'; break;
            }
            
            const html = `
                <div class="order-status ${statusClass} text-center p-3">
                    <i class="fas ${icon} fa-3x mb-2"></i>
                    <h4>${message}</h4>
                    <small class="text-muted">${new Date().toLocaleTimeString()}</small>
                </div>
            `;
            statusDiv.innerHTML = html;
        }

        // Helper
        window.Task = {
            delay: (ms) => new Promise(resolve => setTimeout(resolve, ms))
        };
        
        // Глобальные функции для onclick
        window.addToCart = addToCart;
        window.removeFromCart = removeFromCart;
    </script>
</body>
</html>
